[tool:pytest]
# do not litter the working directory
cache_dir = /tmp/pytest_cache
# slightly more verbose output
console_output_style = count
# pretty-print test names in the Codecov U
junit_family = legacy
addopts =
    # show all skipped/failed/xfailed tests in the summary except passed
    -ra
    --strict-config
    --junitxml=.reports/pytest.xml
    # Enforce deterministic handling of PendingDeprecationWarning from
    # the plugin configuration subsystem so reviewers can spot regressions
    # early and plugin authors see the migration signals.
    -W default::PendingDeprecationWarning:beets.plugins
    -W default::PendingDeprecationWarning:beets.util.config

# Fine-grained warning filters for the legacy plugin config path.
# Any direct use of self.config.add() or config_manager.add() in a plugin
# emits a PendingDeprecationWarning so reviewers can track outstanding
# migrations. The entries below make pytest surface those warnings in the
# test summary (they are NOT treated as errors yet, giving downstream
# plugins time to migrate).
filterwarnings =
    default::PendingDeprecationWarning

[coverage:run]
data_file = .reports/coverage/data
branch = true
relative_files = true
omit =
    test/*
    beets/test/*
    beetsplug/_typing.py
    */*_types.py

[coverage:report]
precision = 2
skip_empty = true
show_missing = true
exclude_also =
    @atexit.register
    if TYPE_CHECKING
    if typing.TYPE_CHECKING
    raise AssertionError
    raise NotImplementedError

[coverage:html]
show_contexts = true

[mypy]
allow_any_generics = false
# FIXME: Would be better to actually type the libraries (if under our control),
# or write our own stubs. For now, silence errors
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

# Temporary, until we decide on a mypy
# config for all files.
[[mypy-beets.plugins]]
disallow_untyped_decorators = true
check_untyped_defs = true

[[mypy-beets.metadata_plugins]]
disallow_untyped_decorators = true
check_untyped_defs = true

[[mypy-beetsplug.musicbrainz]]
strict = true

[[mypy-beetsplug.mbpseudo]]
strict = true

[[mypy-beetsplug._utils]]
strict = true

[[mypy-beetsplug.tidal.*]]
strict = true
