[tool:pytest]
# do not litter the working directory
cache_dir = /tmp/pytest_cache
# slightly more verbose output
console_output_style = count
# pretty-print test names in the Codecov U
junit_family = legacy
addopts =
    # show all skipped/failed/xfailed tests in the summary except passed
    -ra
    --strict-config
    --junitxml=.reports/pytest.xml
filterwarnings =
    # Promote deprecation warnings within beets to errors — this catches
    # accidental re-introduction of alias-like state bugs where a single object
    # is referenced from two attributes (e.g. _matched_playlists ==
    # _unmatched_playlists) and later cleared through only one reference,
    # which would otherwise silently lose data in daemon long-life cycles.
    # Format: action:message:category:module:lineno
    error::DeprecationWarning:beets
    # Same for beetsplug (smartplaylist and other plugins live here).
    error::DeprecationWarning:beetsplug
    # Track pending deprecations as regular warnings so they are visible in
    # CI output but do not fail the test run.
    default::PendingDeprecationWarning

[coverage:run]
data_file = .reports/coverage/data
branch = true
relative_files = true
omit =
    test/*
    beets/test/*
    beetsplug/_typing.py
    */*_types.py

[coverage:report]
precision = 2
skip_empty = true
show_missing = true
exclude_also =
    @atexit.register
    if TYPE_CHECKING
    if typing.TYPE_CHECKING
    raise AssertionError
    raise NotImplementedError

[coverage:html]
show_contexts = true

[mypy]
allow_any_generics = false
# FIXME: Would be better to actually type the libraries (if under our control),
# or write our own stubs. For now, silence errors
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

# Temporary, until we decide on a mypy
# config for all files.
[[mypy-beets.plugins]]
disallow_untyped_decorators = true
check_untyped_defs = true

[[mypy-beets.metadata_plugins]]
disallow_untyped_decorators = true
check_untyped_defs = true

[[mypy-beetsplug.musicbrainz]]
strict = true

[[mypy-beetsplug.mbpseudo]]
strict = true

[[mypy-beetsplug._utils]]
strict = true

[[mypy-beetsplug.tidal.*]]
strict = true
